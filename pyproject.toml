[project]
name = "genai-data-gen-project"
version = "0.1.0"
description = "Conversational data assistant: LLM-driven synthetic data generation from SQL DDL and natural-language 'talk to your data' (Gemini on Vertex AI, Streamlit, PostgreSQL, Langfuse)"
readme = "README.md"
authors = [
    { name = "Aleksander Drwal", email = "olek.drwal@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-genai>=2.19,<3",
    "streamlit>=1.62,<2",
    "langfuse>=4.14,<5",
    "openinference-instrumentation-google-genai>=1.4,<2",
    "psycopg[binary]>=3.3,<4",
    "sqlglot>=30.17,<31",
    "pandas>=3.0,<4",
    "plotly>=6.9,<7",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "faker>=40,<41",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-timeout>=2.3",
    "ruff>=0.16",
    "mypy>=2.3",
    "pandas-stubs>=2.2",
]

[project.scripts]
genai-data-gen = "genai_data_gen_project.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.14"
packages = ["genai_data_gen_project"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: calls Gemini on Vertex AI (needs RUN_LLM_TESTS=1 and ADC)",
    "integration: needs PostgreSQL (make db-up)",
]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
